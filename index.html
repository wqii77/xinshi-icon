<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課表</title>
<!-- 薪事家長端的「外殼頁」（第二十五輪）：把家長端整頁包在裡面，讓手機主畫面和瀏覽器分頁顯示吉祥物。
     這頁沒有任何學生資料；連結 # 後面的家長端代號和密碼只在家長的手機裡讀，不會送到放這頁的伺服器。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2ef">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
html,body{margin:0;height:100%;background:#f2f2ef;color:#1b1b1f;font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif}
body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .2s}
#app.on{opacity:1}
.hop{position:fixed;left:50%;top:42%;width:100px;height:112px;margin:-56px 0 0 -50px;background:url(hop-sheet.webp) 0 0/4000px 112px no-repeat;animation:hop 1.55s steps(40) infinite}
@keyframes hop{to{background-position:-4000px 0}}
.msg{position:fixed;left:18px;right:18px;top:40%;max-width:420px;margin:0 auto;padding:18px;border:2px solid #1b1b1f;border-radius:18px;background:#fff;box-shadow:0 3px 0 #1b1b1f;font-size:16px;line-height:1.6;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="hop" class="hop" aria-hidden="true"></div>
<p id="msg" class="msg" role="alert" hidden></p>
<iframe id="app" title="課表" allow="clipboard-write"></iframe>
<script>
(function(){
  var q=new URLSearchParams(location.hash.slice(1)),id=q.get('s')||'',token=q.get('t')||'';
  var hop=document.getElementById('hop'),msg=document.getElementById('msg'),frame=document.getElementById('app'),shown=false;
  function show(){if(shown)return;shown=true;hop.hidden=true;frame.classList.add('on');}
  // 只包 Google Apps Script 的家長端網址，不能拿來包別的網站。
  if(!/^[A-Za-z0-9_-]{10,200}$/.test(id)||!/^[A-Za-z0-9]{6,64}$/.test(token)){
    hop.hidden=true;frame.hidden=true;msg.hidden=false;msg.textContent='這個連結不完整，請用老師傳來的連結打開。';return;
  }
  window.addEventListener('message',function(e){
    if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin))return;
    var d=e.data||{};if(d.xinshi!=='v1')return;
    if(typeof d.title==='string'&&d.title)document.title=d.title.slice(0,40);
    show();
  });
  frame.addEventListener('load',function(){setTimeout(show,4000);});
  setTimeout(show,15000);
  frame.src='https://script.google.com/macros/s/'+id+'/exec?t='+encodeURIComponent(token);
})();
</script>
</body>
</html>
