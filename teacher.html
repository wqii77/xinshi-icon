<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薪事</title>
<!-- 薪事老師端的「入口頁」（第二十五輪）：從手機主畫面的吉祥物打開，馬上轉到老師端。
     老師端要登入 Google，不能包在別的網頁裡，所以這頁只負責轉過去。網址只存在 # 後面，不會送到放這頁的伺服器。
     第二十六輪 #189：只有「從主畫面全螢幕打開」才自動轉。在 Safari 裡一律停在這頁，
     否則 iPhone 加入主畫面時讀到的是轉過去的 Google 頁面，圖示就變成灰底「薪」。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="薪事">
<meta name="theme-color" content="#f2f2ef">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
:root{--main:#2f5d55;--bg:#f2f2ef;--ink:#1b1b1f;--ink2:#55565c;--danger:#8a2516}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;gap:14px}
.icon{width:84px;height:84px;border-radius:19px;display:block;margin:8px auto 0}
h1{margin:0;text-align:center;font-size:20px}
.card{border:2px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.6}
label{display:flex;flex-direction:column;gap:6px;font-weight:700}
input{font:inherit;font-weight:400;font-size:16px;min-height:46px;box-sizing:border-box;border:2px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;color:var(--ink)}
small{color:var(--ink2);font-size:13px;font-weight:400}
.btn{min-height:50px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);font:inherit;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.primary{background:var(--main);color:#fff}.secondary{background:#fff;color:var(--ink)}
.err{margin:0;color:var(--danger);font-weight:700}
ol{margin:0;padding-left:22px}
.hop{position:fixed;left:50%;top:42%;width:100px;height:112px;margin:-56px 0 0 -50px;background:url(hop-sheet.webp) 0 0/4000px 112px no-repeat;animation:hop 1.55s steps(40) infinite}
@keyframes hop{to{background-position:-4000px 0}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="hop" class="hop" aria-hidden="true" hidden></div>
<main id="setup" hidden>
  <img class="icon" src="icon-180.png" alt="">
  <h1>薪事老師端：加到主畫面</h1>
  <div class="card">
    <label>老師端網址<input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/dev"><small>在手機上打開老師端，從網址列複製整串網址貼在這裡（…/dev 或 …/exec 都可以）。</small></label>
    <p id="err" class="err" role="alert" hidden></p>
    <button id="make" class="btn primary" type="button">下一步</button>
  </div>
  <div id="steps" class="card" hidden>
    <ol>
      <li>按 Safari 下方的「分享」，選「加入主畫面」。</li>
      <li>之後從主畫面的吉祥物打開，就會直接進到老師端（第一次可能要登入 Google）。</li>
    </ol>
    <a id="go" class="btn secondary" href="#">現在打開老師端</a>
  </div>
</main>
<script>
(function(){
  var OK=/^https:\/\/script\.google\.com\/(?:a\/[^\/\s?#]+\/)?macros\/s\/[A-Za-z0-9_-]+\/(?:exec|dev)$/;
  var q=new URLSearchParams(location.hash.slice(1)),u=q.get('u')||'';
  var home=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  // 從主畫面全螢幕打開（# 後面有網址）：直接轉到老師端。
  if(OK.test(u)&&home){document.getElementById('hop').hidden=false;location.replace(u);return;}
  var setup=document.getElementById('setup'),input=document.getElementById('url'),err=document.getElementById('err'),steps=document.getElementById('steps'),go=document.getElementById('go');
  setup.hidden=false;if(OK.test(u))input.value=u;
  function ready(url){
    history.replaceState(null,'',location.pathname+'#u='+encodeURIComponent(url));
    go.href=url;steps.hidden=false;err.hidden=true;
  }
  if(OK.test(u))ready(u);
  document.getElementById('make').onclick=function(){
    var url=input.value.trim().replace(/[?#].*$/,'');
    if(!OK.test(url)){err.textContent='網址格式不對，要是 https://script.google.com/…/dev 或 …/exec。';err.hidden=false;steps.hidden=true;return;}
    input.value=url;ready(url);
  };
})();
</script>
</body>
</html>
