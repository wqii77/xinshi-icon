<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薪事</title>
<!-- 薪事老師端的「入口頁」（第二十五輪）：從手機主畫面的吉祥物打開，馬上轉到老師端。
     老師端要登入 Google，不能包在別的網頁裡，所以這頁只負責轉過去。網址只存在 # 後面，不會送到放這頁的伺服器。
     第二十六輪 #189／#197：只有「從主畫面全螢幕打開」才自動轉。在 Safari 裡一律停在這頁，
     否則 iPhone 加入主畫面時讀到的是轉過去的 Google 頁面，圖示就變成灰底「薪」。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="薪事">
<meta name="theme-color" content="#f2f2ef">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
:root{--main:#2f5d55;--bg:#f2f2ef;--ink:#1b1b1f;--ink2:#55565c;--danger:#8a2516}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;gap:14px}
.icon{width:84px;height:84px;border-radius:19px;display:block;margin:8px auto 0}
.icon.big{width:104px;height:104px;border-radius:24px;margin-top:20px}
.guide{border:2px dashed var(--main);border-radius:18px;background:#fff;padding:14px 16px;font-size:15px;line-height:1.7}
.guide ol{margin:6px 0;padding-left:22px}.guide small{color:var(--ink2);font-size:13px}
.key{display:inline-block;min-width:26px;text-align:center;border:1.5px solid var(--ink);border-radius:999px;background:var(--bg);line-height:1.3}
.tail{margin:0;text-align:center;color:var(--ink2);font-size:13px}
.linkish{border:0;background:none;color:var(--main);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
h1{margin:0;text-align:center;font-size:20px}
.card{border:2px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.6}
label{display:flex;flex-direction:column;gap:6px;font-weight:700}
input{font:inherit;font-weight:400;font-size:16px;min-height:46px;box-sizing:border-box;border:2px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;color:var(--ink)}
small{color:var(--ink2);font-size:13px;font-weight:400}
.btn{min-height:50px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);font:inherit;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.primary{background:var(--main);color:#fff}.secondary{background:#fff;color:var(--ink)}
.err{margin:0;color:var(--danger);font-weight:700}
ol{margin:0;padding-left:22px}
.hop{position:fixed;left:50%;top:42%;width:100px;height:112px;margin:-56px 0 0 -50px;background:url(hop-sheet.webp) 0 0/4000px 112px no-repeat;animation:hop 1.55s steps(40) infinite}
@keyframes hop{to{background-position:-4000px 0}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="hop" class="hop" aria-hidden="true" hidden></div>
<!-- 第二十六輪 #197（畫布 R26-2 A2）：有網址時是「打開薪事」大按鈕＋照新版 Safari 寫的加入主畫面步驟；沒有網址才是貼網址設定卡。 -->
<main id="launch" hidden>
  <img class="icon big" src="icon-180.png" alt="">
  <h1>薪事</h1>
  <a id="open" class="btn primary" href="#">打開薪事</a>
  <div class="guide">
    <b>放到手機主畫面，以後一鍵打開</b>
    <ol>
      <li>按 Safari 右下角 <b class="key">⋯</b>（舊版 Safari 直接按下方「分享」）</li>
      <li>選「分享」，往下找「加入主畫面」</li>
      <li>打開「以網頁 App 打開」，按「加入」</li>
    </ol>
    <small>一定要在這一頁加入，圖示才會是吉祥物。</small>
  </div>
  <p class="tail">老師端網址結尾：<b id="tail"></b>　<button id="change" class="linkish" type="button">更改</button></p>
</main>
<main id="setup" hidden>
  <img class="icon" src="icon-180.png" alt="">
  <h1>薪事：設定入口</h1>
  <div class="card">
    <label>老師端網址<input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"><small>打開你的薪事老師端，從網址列複製整串網址貼在這裡（…/exec 或 …/dev 都可以）。只需要做一次。</small></label>
    <p id="err" class="err" role="alert" hidden></p>
    <button id="make" class="btn primary" type="button">完成</button>
  </div>
</main>
<script>
(function(){
  var OK=/^https:\/\/script\.google\.com\/(?:a\/[^\/\s?#]+\/)?macros\/s\/[A-Za-z0-9_-]+\/(?:exec|dev)$/;
  var q=new URLSearchParams(location.hash.slice(1)),u=q.get('u')||'';
  var home=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  // 打開老師端時帶 entry=1，老師端就知道是從入口來的，不顯示「放到主畫面」提示條。
  function target(url){return url+'?entry=1';}
  // 從主畫面全螢幕打開（# 後面有網址）：直接轉到老師端。在 Safari 裡一律停在這頁（第二十六輪 #189）。
  if(OK.test(u)&&home){document.getElementById('hop').hidden=false;location.replace(target(u));return;}
  var launch=document.getElementById('launch'),setup=document.getElementById('setup'),input=document.getElementById('url'),err=document.getElementById('err');
  function showLaunch(url){
    history.replaceState(null,'',location.pathname+'#u='+encodeURIComponent(url));
    document.getElementById('open').href=target(url);document.getElementById('tail').textContent=url.slice(-5);
    setup.hidden=true;launch.hidden=false;
  }
  function showSetup(){launch.hidden=true;setup.hidden=false;if(OK.test(u))input.value=u;input.focus();}
  if(OK.test(u))showLaunch(u);else showSetup();
  document.getElementById('change').onclick=showSetup;
  document.getElementById('make').onclick=function(){
    var url=input.value.trim().replace(/[?#].*$/,'');
    if(!OK.test(url)){err.textContent='網址格式不對，要是 https://script.google.com/…/exec 或 …/dev。';err.hidden=false;return;}
    err.hidden=true;u=url;showLaunch(url);
  };
})();
</script>
</body>
</html>
